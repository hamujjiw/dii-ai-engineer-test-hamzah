name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sepsis-early-warning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sepsis-early-warning/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sepsis-api sepsis-early-warning
      - name: Run container
        run: docker run -d --name sepsis -p 8000:8000 sepsis-api
      - name: Smoke test /health and /predict
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"heart_rate":122,"respiratory_rate":29,"temperature":39.2,"wbc_count":18.1,"lactate_level":4.7,"age":83,"num_comorbidities":4}' | tee out.json
          python3 -c "import json; r = json.load(open('out.json')); assert r['sepsis_risk_prediction'] == 1, r"
      - name: Container logs (on failure)
        if: failure()
        run: docker logs sepsis
